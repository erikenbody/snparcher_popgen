###############################################################################
# Project configuration.
#
# Only final_prefix and refgenome are strictly required — everything else has a
# default (see workflow/schemas/config.schema.yaml). The values below are the
# defaults, spelled out so you can see what you are getting.
#
# Run with:
#   snakemake --use-conda --cores 20 --configfile config/config.yaml
###############################################################################

# --- project ----------------------------------------------------------------
# Inputs are looked up under results/{refgenome}/ relative to the working
# directory (use --directory to point at a project folder).
final_prefix: my-project
refgenome: GCA_000000000.1

# --- input ------------------------------------------------------------------
# The workflow starts from results/{refgenome}/{final_prefix}_clean_snps.vcf.gz:
# a filtered, biallelic SNP VCF. Site filtering is the variant caller's job.
exclude_samples: null         # e.g. results/GCA_000000000.1/my-project_samps.txt

# A callable-sites BED, if you have one (snpArcher produces one). Its only job is
# to provide the denominator for pi and heterozygosity. With null the denominator
# is the whole assembly length, which biases both low. clam does not need it — it
# derives callability from the GVCFs.
callable_sites_bed: null

# --- coordinates ------------------------------------------------------------
# Set use_coords to false to run the whole workflow with no coordinates at all.
# TESS and every map panel are then skipped and populations come from ADMIXTURE.
use_coords: true
coords_sheet: config/coords.tsv
drop_samples_without_coords: true

# --- SNP subsetting ---------------------------------------------------------
scaffolds_to_exclude: ""     # e.g. "mtDNA,Y"; sex-linked ones are found for you
missingness: 0.25            # applied to the ADMIXTURE/TESS subsample
ld_r2: 0.6
subsample_maf: 0.05

# --- structure --------------------------------------------------------------
admixture_kmax: 10
admixture_seeds: [42, 420, 69, 666, 80085]
run_tess: true
tess_kvals: "1:10"

# --- population assignment --------------------------------------------------
# Start with manual_k_assignment: null, look at
#   results/{refgenome}/structure/{prefix}_structure_composite.pdf,
# then pin K here and rerun.
method: admixture
manual_k_assignment: null
qvalue_threshold: 0.8

# --- per-population statistics ---------------------------------------------
min_samples_per_pop: 2
roh_min_size: 500000
roh_merge_gap: 10000
pi_window: 10000
min_scaffold_size: 10000000

# --- GONE (recent Ne) -------------------------------------------------------
run_gone: false
gone_path: null              # null => cloned and built into resources/GONE
gone_seeds: 10
gone_n_chroms: 5

# --- clam (callable-site aware pi/dxy/Fst/heterozygosity) -------------------
run_clam: false              # needs per-sample GVCFs; set gvcf_dir when enabling
gvcf_dir: null               # e.g. /path/to/gvcfs, holding {sample}.g.vcf.gz
clam_window: 50000
clam_min_gq: 0
clam_mean_depth_sd_scale: 2
clam_depths_zarr_dir: null   # e.g. /bulk/depths/{refGenome}/{prefix}
clam_keep_depths_zarr: false
clam_threads: 16
