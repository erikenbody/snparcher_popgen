$schema: "https://json-schema.org/draft/2020-12/schema"
description: >
  Configuration for the population-genomics workflow. Every key except vcf has
  a default supplied here, so a minimal config.yaml needs only vcf (plus
  coords_sheet if use_coords is true, gvcf_dir if run_clam is true, and
  refgenome, callable_sites_bed and trackhub_email if run_trackhub is true).

type: object

properties:

  # ------------------------------------------------------------------- inputs
  vcf:
    type: string
    description: >
      The filtered, biallelic SNP VCF this workflow starts from (e.g.
      snpArcher's clean_snps.vcf.gz), bgzipped and indexed. Relative paths are
      relative to the working directory.
  fai:
    type: ["string", "null"]
    default: null
    description: >
      Optional reference .fai. Only its first two columns (contig, length) are
      used. null: contig lengths are read from the VCF's ##contig header lines,
      which GATK, Sentieon and bcftools write for every reference contig.
  callable_sites_bed:
    type: ["string", "null"]
    default: null
    description: >
      Optional BED (plain or gzipped) of callable sites, e.g. snpArcher's
      callable_sites.bed. Provides the denominator for pi and per-sample
      heterozygosity, and the non-callable track of the track hub. When null,
      the pi/heterozygosity denominator is the summed length of all contigs,
      which counts never-callable sequence, so both come out biased low and are
      not comparable across projects. clam does not use this: it derives
      callability per sample from the GVCFs.

  # ------------------------------------------------------------------ outputs
  final_prefix:
    type: string
    default: popgen
    description: >
      Label used in output file names and figure titles — typically the project
      name. It is not part of any input path.
  outdir:
    type: string
    default: results/popgen
    description: Every output is written under this directory.
  logdir:
    type: string
    default: logs/popgen
    description: Every log is written under this directory.
  refgenome:
    type: ["string", "null"]
    default: null
    description: >
      Reference assembly accession (e.g. GCA_024610735.1). Only the track hub
      uses it, to point at UCSC's GenArk assembly.

  # ------------------------------------------------------------- coordinates
  use_coords:
    type: boolean
    default: true
    description: >
      true: read sample coordinates from coords_sheet; enables TESS, pie plots
      and all map panels. false: run the entire workflow without coordinates.
      TESS is force-disabled and population assignment falls back to ADMIXTURE.
  coords_sheet:
    type: ["string", "null"]
    default: null
    description: >
      Required when use_coords is true. Tab- or comma-delimited (by extension:
      .csv is comma, anything else tab), with a header row and columns for
      sample ID, longitude and latitude (extra columns are ignored, so
      snpArcher's sample_metadata.csv with sample_id/lat/long works). Sample IDs
      must match the VCF sample names.
  drop_samples_without_coords:
    type: boolean
    default: true
    description: >
      Only used when use_coords is true. true: samples absent from coords_sheet
      (or with blank coordinates) are removed from the analysis VCF, so every
      downstream analysis sees the same sample set. false: keep them, and error
      out instead if any sample lacks coordinates.

  # ----------------------------------------------------------- SNP subsetting
  missingness:
    type: number
    default: 0.25
    description: >
      Applied when building the ~1M SNP subsample for ADMIXTURE and TESS: SNPs
      with more than this fraction of missing calls are dropped. 1 disables.
      Site-level filtering of the input VCF is the variant caller's job.
  ld_r2:
    type: number
    default: 0.6
    description: r^2 threshold for the LD-pruned SNP set used by PCA/ADMIXTURE/TESS.
  subsample_maf:
    type: number
    default: 0.05
    description: Stricter MAF applied when building the ~1M SNP subsample.

  # ---------------------------------------------------------------- structure
  admixture_kmax:
    type: integer
    default: 10
    minimum: 1
    description: ADMIXTURE is run for K = 1..admixture_kmax.
  admixture_seeds:
    type: array
    items:
      type: integer
    default: [42, 420, 69, 666, 80085]
    description: >
      One ADMIXTURE replicate per seed. The first seed is the one whose Q
      matrices are plotted, so keep it stable across reruns.
  run_tess:
    type: boolean
    default: true
    description: >
      Run TESS (spatially-explicit ancestry) and the pie-chart maps. Requires
      use_coords; ignored (treated as false) when use_coords is false.
  tess_kvals:
    type: string
    default: "1:10"
    description: >
      R-style range of K values for TESS. Must start at 1 (e.g. "1:10"): the
      automatic K choice indexes cross-entropy by K.
  tess_seed:
    type: integer
    default: 42
    description: Random seed for TESS3, so reruns reproduce the same Q matrices.
  tess3r_ref:
    type: string
    default: 1e333c2b8d6fdb59e52996d18276ee6ee1ab25a4
    description: >
      Commit of github.com/bcm-uga/TESS3_encho_sen installed into the TESS
      environment (tess3r is not on conda).

  # ----------------------------------------------------- population assignment
  method:
    type: string
    enum: ["admixture", "tess"]
    default: "admixture"
    description: >
      Which ancestry estimate defines the populations used for all downstream
      per-population statistics. "tess" requires run_tess.
  manual_k_assignment:
    type: ["integer", "null"]
    default: null
    minimum: 1
    description: >
      Number of populations to split samples into. null: use the best K chosen
      automatically (cross-validation for ADMIXTURE, cross-entropy for TESS).
      Inspect the composite PDF and set this explicitly for real analyses.
  qvalue_threshold:
    type: number
    default: 0.8
    description: >
      Samples whose top ancestry coefficient is below this are treated as
      admixed and excluded from all per-population statistics.

  # ------------------------------------------------------------- per-pop stats
  min_samples_per_pop:
    type: integer
    default: 2
    description: Populations with fewer assigned samples are skipped.
  roh_min_size:
    type: integer
    default: 500000
    description: ROH shorter than this (bp) are ignored when computing F_ROH.
  roh_merge_gap:
    type: integer
    default: 10000
    description: Adjacent ROH separated by this many bp or fewer are merged.
  pi_window:
    type: integer
    default: 10000
    description: Window size (bp) for per-individual windowed pi.
  min_scaffold_size:
    type: integer
    default: 10000000
    description: >
      Scaffolds shorter than this (bp) are excluded from genome-wide summaries
      of pi/heterozygosity/F_ROH.

  # ---------------------------------------------------------------------- Ne
  run_ne:
    type: boolean
    default: false
    description: >
      Estimate recent Ne trajectories (GONE2) and contemporary Ne (currentNe2)
      per population. Both are compiled from source on first use (needs network
      access and a Linux toolchain, supplied by conda).
  ne_tools_dir:
    type: string
    default: resources/ne_tools
    description: >
      Where GONE2 and currentNe2 are compiled. Point it at a shared absolute
      path to build once for many projects.
  ne_gone2_ref:
    type: string
    default: d26797efde6f4fc2094d26b500aaedff760ebcf9
    description: Commit of github.com/esrud/GONE2 to build.
  ne_currentne2_ref:
    type: string
    default: 4ee170d369fbf7b4111b4d44b689fe7ae15d40c0
    description: Commit of github.com/esrud/currentNe2 to build.
  ne_max_snps:
    type: integer
    default: 2000000
    description: >
      Compiled-in locus limit of both tools; each population's VCF is randomly
      thinned to at most this many SNPs. RAM grows with ne_max_snps x ne_max_ind
      (about 4 GB at the defaults).
  ne_max_ind:
    type: integer
    default: 2000
    description: Compiled-in sample-size limit of both tools.
  ne_min_contig_size:
    type: integer
    default: 1000000
    description: Contigs shorter than this (bp) are not used for Ne.
  ne_max_contigs:
    type: integer
    default: 1000
    maximum: 1000
    description: >
      At most this many of the largest qualifying contigs are used (both tools
      cap the number of chromosomes at 1000).
  ne_recomb_rate:
    type: number
    default: 1.0
    description: >
      Constant recombination rate (cM/Mb) used by both tools to turn physical
      positions into genetic distances.
  ne_seed:
    type: integer
    default: 1
    description: Random seed for SNP thinning and for GONE2 (-S).
  ne_threads:
    type: integer
    default: 8
    description: Threads per GONE2 / currentNe2 run.
  ne_gone2_modes:
    type: array
    items:
      type: string
      enum: ["standard", "metapop"]
    default: ["standard"]
    description: >
      GONE2 runs per population. "metapop" adds -x (structured population),
      subsampled to ne_gone2_metapop_snps SNPs because -x is slow.
  ne_gone2_metapop_snps:
    type: integer
    default: 20000
    description: SNPs used by GONE2 -x runs (-s), as the GONE2 README recommends.
  ne_currentne2_modes:
    type: array
    items:
      type: string
      enum: ["standard", "metapop"]
    default: ["standard", "metapop"]
    description: >
      currentNe2 runs per population. "metapop" adds -x (two equal-sized
      subpopulations), which cannot be combined with -k.
  ne_currentne2_k:
    type: ["number", "null"]
    default: null
    description: >
      currentNe2 -k for standard runs: >0 average number of full siblings per
      individual in the population, 0 random mating, <0 the sample value. null
      leaves -k out, so currentNe2 estimates it from the data.

  # -------------------------------------------------------------------- clam
  run_clam:
    type: boolean
    default: false
    description: >
      Run clam for callable-site-aware pi, dxy, Fst and ROH-corrected
      heterozygosity from GVCFs. Off by default because it needs per-sample
      GVCFs, which many projects will not have kept. Requires gvcf_dir.
  gvcf_dir:
    type: ["string", "null"]
    default: null
    description: >
      Required when run_clam is true. Directory holding one bgzipped, tabixed
      GVCF per sample, named {sample}.g.vcf.gz (+ .tbi). May contain more
      samples than the VCF; only assigned samples are read. May contain a
      {prefix} placeholder.
  clam_window:
    type: integer
    default: 50000
    description: Window size (bp) for clam's windowed statistics.
  clam_min_gq:
    type: integer
    default: 0
    description: >
      Minimum GQ for a GVCF depth value to count. 0 disables, matching the
      rest of the workflow, which applies no GQ filter.
  clam_mean_depth_sd_scale:
    type: number
    default: 2
    description: >
      Per-chromosome callable-depth bounds are mean +/- N*sqrt(mean) (Poisson
      SD), computed across all samples and positions.
  clam_depths_zarr_dir:
    type: ["string", "null"]
    default: null
    description: >
      Where `clam collect` writes its per-sample depth store. null means
      {outdir}/clam/depths.zarr. This store is large (~n_samples *
      genome_length * 4 bytes before compression); point it at bulk storage for
      big projects. May contain a {prefix} placeholder.
  clam_keep_depths_zarr:
    type: boolean
    default: false
    description: >
      Keep the depth store after callable loci are computed. Useful when
      iterating, since `clam collect` is the most expensive step.
  clam_threads:
    type: integer
    default: 16
    description: Threads for clam collect/loci/stat.

  # ---------------------------------------------------------------- trackhub
  run_trackhub:
    type: boolean
    default: false
    description: >
      Build a UCSC track hub (windowed Tajima's D, SNP density and pi, depth,
      allele frequency, non-callable regions, the SNPs). Requires refgenome,
      callable_sites_bed and trackhub_email.
  trackhub_email:
    type: ["string", "null"]
    default: null
    description: Contact address written into hub.txt (UCSC requires one).

required:
  - vcf
